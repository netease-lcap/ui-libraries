name: Test CI

on:
  pull_request:
    branches: [ "*", "release/*"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set node
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Install pnpm
      run: npm install -g pnpm@10.4.0

    - name: Install Dependencies
      run: pnpm install

    - run: npm run test
